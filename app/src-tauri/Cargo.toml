[package]
name = "adaptive-skills-desktop"
version = "0.1.1"
description = "Local desktop manager for the Adaptive Skills catalog"
authors = ["Adaptive Skills contributors"]
edition = "2021"

[lib]
name = "adaptive_skills_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
